services:
  db:
    image: postgres:17-alpine
    container_name: tradelens-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tradelens
      POSTGRES_PASSWORD: tradelens
      POSTGRES_DB: tradelens
    ports:
      - "5432:5432"
    volumes:
      - tradelens-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradelens -d tradelens"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  tradelens-pgdata:
